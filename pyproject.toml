[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "super-scientist-orchestration-harness"
version = "0.3.0"
description = "Transactional orchestration foundation for auditable scientific research"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "InfiniteMalice" }]
dependencies = [
  "alembic>=1.13,<2",
  "click==8.3.3",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2,<3",
  "typer==0.19.2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "hypothesis>=6,<7",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "PyYAML>=6,<7",
  "ruff==0.16.0",
  "twine>=5,<7",
]

[project.scripts]
scientist-harness = "super_scientist.cli.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super_scientist"]

[tool.hatch.build.targets.wheel.force-include]
alembic = "super_scientist/_migrations"
"examples/governed_cognitive_procedure_vertical_slice.py" = "super_scientist_examples/governed_cognitive_procedure_vertical_slice.py"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: tests using SQLite or filesystem boundaries",
  "property: property-based tests",
  "e2e: deterministic end-to-end workflows",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["super_scientist"]

[tool.coverage.run]
branch = true
source = ["super_scientist"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
